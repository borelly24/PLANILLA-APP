<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Redes Eléctricas - Obras y Estaciones</title>
    <!-- Tailwind CSS para un diseño limpio y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col">
        <!-- Contenido dinámico inyectado por JS -->
    </div>

    <script>
        // Estado de la aplicación
        let state = {
            currentView: 'home', // 'home' (obras), 'stations' (estaciones de una obra), 'materials' (materiales de una estación), 'consolidated' (consolidado general de obra)
            currentObra: null,
            currentStation: null,
            obras: [
                {
                    id: 1,
                    nombre: "Normalización Redes B.T. Barrio San Jose",
                    estaciones: [
                        { nombre: "Apoyo 01", materiales: [{codigo: "ELE001", desc: "Poste de Concreto 12m", cant: 2}, {codigo: "ELE002", desc: "Cable de Acero 3/8", cant: 30}] },
                        { nombre: "Apoyo 02", materiales: [{codigo: "ELE003", desc: "Transformador 45kVA", cant: 1}] }
                    ]
                },
                {
                    id: 2,
                    nombre: "Expansión Media Tensión Sector Sur",
                    estaciones: [
                        { nombre: "Poste Troncal 1", materiales: [{codigo: "ELE004", desc: "Seccionador Tripolar", cant: 1}] }
                    ]
                }
            ]
        };

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (state.currentView === 'home') {
                app.innerHTML = renderHomeView();
            } else if (state.currentView === 'stations') {
                app.innerHTML = renderStationsView();
            } else if (state.currentView === 'materials') {
                app.innerHTML = renderMaterialsView();
            } else if (state.currentView === 'consolidated') {
                app.innerHTML = renderConsolidatedView();
            }
        }

        // 1. Vista de Obras (Home)
        function renderHomeView() {
            return `
                <header class="bg-blue-700 text-white p-4 shadow-md">
                    <h1 class="text-xl font-bold">Obras Eléctricas</h1>
                    <p class="text-xs text-blue-200">Seleccione una obra para gestionar</p>
                </header>
                <main class="p-4 flex-1 overflow-y-auto space-y-3">
                    ${state.obras.map(obra => `
                        <div onclick="selectObra(${obra.id})" class="bg-white p-4 rounded-lg shadow border border-slate-200 cursor-pointer hover:border-blue-500 transition">
                            <h2 class="font-bold text-blue-900">${obra.nombre}</h2>
                            <p class="text-xs text-slate-500 mt-1">${obra.estaciones.length} Estación(es) registrada(s)</p>
                        </div>
                    `).join('')}
                    <button onclick="nuevaObra()" class="w-full mt-4 bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">+ Nueva Obra</button>
                </main>
            `;
        }

        // 2. Vista de Estaciones / Apoyos (Con botón de Consolidado Arriba)
        function renderStationsView() {
            const obra = state.currentObra;
            return `
                <header class="bg-blue-700 text-white p-4 shadow-md flex items-center justify-between">
                    <div>
                        <button onclick="goHome()" class="text-xs text-blue-200 hover:underline mb-1 block">&larr; Volver a Obras</button>
                        <h1 class="text-lg font-bold truncate max-w-[260px]">${obra.nombre}</h1>
                    </div>
                </header>
                <main class="p-4 flex-1 overflow-y-auto space-y-4">
                    <!-- BOTÓN DE CONSOLIDADO SUPERIOR -->
                    <button onclick="openConsolidated()" class="w-full bg-emerald-600 text-white p-3 rounded-lg font-semibold shadow hover:bg-emerald-700 transition flex items-center justify-center space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        <span>Ver Consolidado de Materiales</span>
                    </button>

                    <div class="border-t border-slate-200 pt-2">
                        <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-2">Estaciones / Apoyos</h2>
                        <div class="space-y-2">
                            ${obra.estaciones.map((est, idx) => `
                                <div onclick="selectStation(${idx})" class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 flex justify-between items-center cursor-pointer hover:bg-slate-50 transition">
                                    <div>
                                        <span class="font-bold text-slate-800">${est.nombre}</span>
                                        <p class="text-xs text-slate-500">${est.materiales.length} tipo(s) de materiales</p>
                                    </div>
                                    <span class="text-blue-600 font-bold">&rsaquo;</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <button onclick="nuevaEstacion()" class="w-full bg-blue-50 text-blue-700 border border-blue-300 py-2 rounded-lg font-semibold hover:bg-blue-100 transition">+ Añadir Estación / Apoyo</button>
                </main>
            `;
        }

        // 3. Vista de Materiales de una Estación específica
        function renderMaterialsView() {
            const est = state.currentStation;
            return `
                <header class="bg-blue-700 text-white p-4 shadow-md flex items-center justify-between">
                    <div>
                        <button onclick="backToStations()" class="text-xs text-blue-200 hover:underline mb-1 block">&larr; Volver a Estaciones</button>
                        <h1 class="text-lg font-bold">${est.nombre}</h1>
                    </div>
                </header>
                <main class="p-4 flex-1 overflow-y-auto space-y-3 pb-20">
                    <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Materiales Registrados</h2>
                    ${est.materiales.length === 0 ? '<p class="text-sm text-slate-400 italic">No hay materiales en esta estación.</p>' : ''}
                    ${est.materiales.map((mat, idx) => `
                        <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 flex justify-between items-center">
                            <div>
                                <span class="text-xs font-mono bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">${mat.codigo}</span>
                                <h3 class="font-medium text-slate-800 text-sm mt-1">${mat.desc}</h3>
                            </div>
                            <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-1 rounded-full">Cant: ${mat.cant}</span>
                        </div>
                    `).join('')}

                    <!-- Botón flotante para agregar material a la estación -->
                    <button onclick="nuevoMaterial()" class="fixed bottom-6 right-6 bg-blue-600 text-white p-4 rounded-full shadow-lg hover:bg-blue-700 transition flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </button>
                </main>
            `;
        }

        // 4. Vista de Consolidado General de la Obra
        function renderConsolidatedView() {
            const obra = state.currentObra;
            // Agrupar materiales de todas las estaciones
            const mapConsolidado = {};
            obra.estaciones.forEach(est => {
                est.materiales.forEach(mat => {
                    if (!mapConsolidado[mat.codigo]) {
                        mapConsolidado[mat.codigo] = { desc: mat.desc, cant: 0 };
                    }
                    mapConsolidado[mat.codigo].cant += Number(mat.cant);
                });
            });
            const listaConsolidada = Object.keys(mapConsolidado).map(codigo => ({
                codigo,
                desc: mapConsolidado[codigo].desc,
                cant: mapConsolidado[codigo].cant
            }));

            return `
                <header class="bg-emerald-700 text-white p-4 shadow-md flex items-center justify-between">
                    <div>
                        <button onclick="backToStations()" class="text-xs text-emerald-200 hover:underline mb-1 block">&larr; Volver a Estaciones</button>
                        <h1 class="text-lg font-bold">Consolidado de Obra</h1>
                    </div>
                </header>
                <main class="p-4 flex-1 overflow-y-auto space-y-3">
                    <p class="text-xs text-slate-500">Suma total de materiales de todas las estaciones en <b>${obra.nombre}</b>.</p>
                    ${listaConsolidada.length === 0 ? '<p class="text-sm text-slate-400 italic">No hay registros consolidados.</p>' : ''}
                    ${listaConsolidada.map(item => `
                        <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 flex justify-between items-center">
                            <div>
                                <span class="text-xs font-mono bg-emerald-50 text-emerald-700 px-1.5 py-0.5 rounded">${item.codigo}</span>
                                <h3 class="font-medium text-slate-800 text-sm mt-1">${item.desc}</h3>
                            </div>
                            <span class="bg-emerald-100 text-emerald-800 text-sm font-bold px-3 py-1 rounded-full">Total: ${item.cant}</span>
                        </div>
                    `).join('')}
                </main>
            `;
        }

        // Acciones de control y navegación
        function selectObra(id) {
            state.currentObra = state.obras.find(o => o.id === id);
            state.currentView = 'stations';
            render();
        }

        function goHome() {
            state.currentObra = null;
            state.currentStation = null;
            state.currentView = 'home';
            render();
        }

        function selectStation(idx) {
            state.currentStation = state.currentObra.estaciones[idx];
            state.currentView = 'materials';
            render();
        }

        function backToStations() {
            state.currentStation = null;
            state.currentView = 'stations';
            render();
        }

        function openConsolidated() {
            state.currentView = 'consolidated';
            render();
        }

        function nuevaObra() {
            const nombre = prompt("Ingrese el nombre de la nueva obra:");
            if (nombre) {
                state.obras.push({ id: Date.now(), nombre, estaciones: [] });
                render();
            }
        }

        function nuevaEstacion() {
            const nombre = prompt("Ingrese el nombre o código de la estación/apoyo (ej: Apoyo 03):");
            if (nombre) {
                state.currentObra.estaciones.push({ nombre, materiales: [] });
                render();
            }
        }

        function nuevoMaterial() {
            const codigo = prompt("Ingrese el código del material (ej: ELE001):");
            if (!codigo) return;
            const desc = prompt("Ingrese la descripción del material:");
            if (!desc) return;
            const cant = prompt("Ingrese la cantidad:", "1");
            if (cant) {
                state.currentStation.materiales.push({ codigo, desc, cant: Number(cant) });
                render();
            }
        }

        // Inicializar app
        render();
    </script>
</body>
</html>
