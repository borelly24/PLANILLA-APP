<div class="filtros-container">
    <div class="filtros-header">FILTROS DE CAMPO</div>
    <div class="filtros-inputs-row">
        <!-- Campo de búsqueda por ítem o descripción -->
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="filtroItem" placeholder="Buscar Ítem..." onkeyup="filtrarTabla()">
        </div>
        
        <!-- Selector desplegable de Estación -->
        <div class="select-box">
            <select id="filtroEstacion" onchange="filtrarTabla()">
                <option value="">Estación</option>
                <!-- Aquí puedes poblar dinámicamente o dejar las opciones -->
                <option value="EPP 01-1">EPP 01-1</option>
            </select>
        </div>

        <!-- Botón de Calendario / Filtro por Fecha -->
        <div class="date-box" onclick="abrirFiltroFecha()" title="Filtrar por fecha">
            <svg class="calendar-icon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
                <rect x="7" y="14" width="3" height="3" fill="currentColor"></rect>
                <rect x="14" y="14" width="3" height="3" fill="currentColor"></rect>
            </svg>
        </div>
    </div>
</div>

<style>
.filtros-container {
    background-color: #e9ecef;
    border: 1px solid #ced4da;
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-family: Arial, sans-serif;
}

.filtros-header {
    font-weight: bold;
    font-size: 14px;
    color: #333;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
}

.filtros-inputs-row {
    display: flex;
    gap: 8px;
    align-items: center;
}

.search-box {
    flex: 2;
    display: flex;
    align-items: center;
    background: #fff;
    border: 1px solid #ced4da;
    border-radius: 4px;
    padding: 6px 10px;
}

.search-box input {
    border: none;
    outline: none;
    width: 100%;
    font-size: 14px;
    color: #495057;
    background: transparent;
}

.search-icon {
    margin-right: 6px;
    font-size: 14px;
}

.select-box {
    flex: 1.2;
}

.select-box select {
    width: 100%;
    background: #fff;
    border: 1px solid #ced4da;
    border-radius: 4px;
    padding: 7px 10px;
    font-size: 14px;
    color: #333;
    outline: none;
    cursor: pointer;
}

.date-box {
    background: #fff;
    border: 1px solid #ced4da;
    border-radius: 4px;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #333;
    transition: background 0.2s;
}

.date-box:hover {
    background: #f1f3f5;
}
</style>
