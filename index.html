<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planilla App - Supervisor Eléctrico</title>
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- SheetJS (XLSX) para exportar a Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Catálogo semilla completo para la planilla
        const SEED_CATALOG = [
            { armado: "POSTE", item: "80", descripcion: "Colocación de poste de concreto de 12m o 14m – 2.500, 1.600, 1.324, 1.030, 735 o 500 daN" },
            { armado: "POSTE", item: "81", descripcion: "Colocación de poste de concreto de 8, 9 o 10m – 1.324, 1.030, 735 o 500 daN" },
            { armado: "POSTE", item: "1459733", descripcion: "POSTE HPC/HPV 9MX500 DAN(CR)" },
            { armado: "POSTE", item: "1807941", descripcion: "POSTE HPC/HPV 9MX735 DAN(CR)" },
            { armado: "POSTE", item: "1807940", descripcion: "POSTE HPC/HPV 9MX1030 DAN(CR)" },
            { armado: "POSTE", item: "1475174", descripcion: "POSTE HPC/HPV 12MX735 DAN(CR)" },
            { armado: "POSTE", item: "1465239", descripcion: "POSTE HPC/HPV 12MX1030 DAN(CR)" },
            { armado: "POSTE", item: "1807947", descripcion: "POSTE HPC/HPV 12MX1324 DAN(CR)" },
            { armado: "POSTE", item: "2000070", descripcion: "POSTE HPC/HPV 12MX1600 DAN(CR)" },
            { armado: "POSTE", item: "88", descripcion: "Concreto Fc=210kgf/cm2 fundición para poste" },
            { armado: "POSTE", item: "1310002", descripcion: "CEMENTO GRIS" },
            { armado: "POSTE", item: "89", descripcion: "Colocación del sistema de puesta a tierra" },
            { armado: "POSTE", item: "1808482", descripcion: "CABLE DESNUDO COPPER CLAD 7H#8AWG 3/8\"" },
            { armado: "POSTE", item: "1525655", descripcion: "VARILLA DE PUESTA A TIERRA 5/8X8\"" },
            { armado: "POSTE", item: "1808483", descripcion: "CONECTOR CUÑA PAT 5/8\" P/CABLE(CCS)" },
            { armado: "POSTE", item: "1531537", descripcion: "CONECTOR COMPRESION PICA PT" },
            { armado: "FIBRA", item: "82", descripcion: "Colocación de poste de fibra 12, 14m -1.600, 1.324, 1.030, 735 o 500 daN" },
            { armado: "FIBRA", item: "83", descripcion: "Colocación de poste de fibra de 8, 9 o 10m - 1.600, 1.324, 1.030, 735 o 500 daN" },
            { armado: "FIBRA", item: "1931817", descripcion: "POSTE FIBRA VIDRIO 9MX500 DAN(CR)" },
            { armado: "FIBRA", item: "2000074", descripcion: "POSTE FIBRA VIDRIO 9MX735 DAN(CR)" },
            { armado: "FIBRA", item: "2000295", descripcion: "POSTE FIBRA VIDRIO 9MX1030 DAN(CR)" },
            { armado: "FIBRA", item: "1931407", descripcion: "POSTE FIBRA VIDRIO 12MX500 DAN(CR)" },
            { armado: "FIBRA", item: "1918420", descripcion: "POSTE FIBRA VIDRIO 12MX735 DAN(CR)" },
            { armado: "FIBRA", item: "2000075", descripcion: "POSTE FIBRA VIDRIO 12MX1030 DAN(CR)" },
            { armado: "MT121-131", item: "103", descripcion: "Colocación de adecuación poste en terminal para 13.2kV" },
            { armado: "MT121-131", item: "1931053", descripcion: "CRUCETA METALICA BANDERA 2400MM" },
            { armado: "MT121-131", item: "1464431", descripcion: "DIAGONAL ANGULAR 7 (PIES)" },
            { armado: "MT121-131", item: "1440944", descripcion: "ARANDELA PLANA REDONDA 5/8\"" },
            { armado: "MT121-131", item: "1440860", descripcion: "GRAPA CONEXIÓN CABLE TIERRA S/TORN 5/8\"" },
            { armado: "MT121-131", item: "1437659", descripcion: "TUERCA EXAGONAL ACERO GALV. 5/8\"" },
            { armado: "MT121-131", item: "1464705", descripcion: "PERNO DE CARRUAJE DE 5/8 X 3\"" },
            { armado: "MT121-131", item: "1437658", descripcion: "TORNILLO AC.GALVANIZ.CON OJO.C.T.5/8X12\"" },
            { armado: "MT121-131", item: "1551282", descripcion: "PERNO ROSCA CORRIDA AC.GALV. 5/8X12\"" },
            { armado: "MT121-131", item: "1464245", descripcion: "ABRAZADERA DOBLE DE 180MM DE 2 SALIDAS" },
            { armado: "MT121-131", item: "1464250", descripcion: "ABRAZADERA DOBLE DE 200MM DE 2 SALIDAS" },
            { armado: "MT121-131", item: "1464252", descripcion: "ABRAZADERA DOBLE DE 220MM DE 2 SALIDAS" },
            { armado: "MT121-131", item: "1437647", descripcion: "TORNILLO AC.GALVANIZ.C.T.5/8X6\"" },
            { armado: "MT121-131", item: "1441249", descripcion: "AISLADOR POLIMERICO SUSP 13.2KV" },
            { armado: "MT121-131", item: "1450949", descripcion: "GRAPA DE RETENCION RECTA ALUMINIO 1/0AWG" },
            { armado: "MT121-131", item: "1551418", descripcion: "GRILLETE LARGO RECTO 5/8 11 300 KG" }
        ];

        function App() {
            // Estado de proyectos cargados desde localStorage para persistencia
            const [proyectos, setProyectos] = useState(() => {
                const saved = localStorage.getItem("proyectos_planilla");
                return saved ? JSON.parse(saved) : [
                    { id: "1", nombre: "Proyecto Redes Media Tensión - Sector Norte", circuito: "MT-102", municipio: "Magangué", items: {} }
                ];
            });

            const [proyectoActivoId, setProyectoActivoId] = useState(null);
            const [busquedaMaterial, setBusquedaMaterial] = useState("");
            
            // Estados para modales de proyectos
            const [modalCrear, setModalCrear] = useState(false);
            const [modalEditar, setModalEditar] = useState(false);
            const [nombreProyectoInput, setNombreProyectoInput] = useState("");
            const [circuitoInput, setCircuitoInput] = useState("");
            const [municipioInput, setMunicipioInput] = useState("");
            const [proyectoAEditar, setProyectoAEditar] = useState(null);

            useEffect(() => {
                localStorage.setItem("proyectos_planilla", JSON.stringify(proyectos));
            }, [proyectos]);

            const proyectoActivo = proyectos.find(p => p.id === proyectoActivoId);

            // Funciones de gestión de proyectos
            const handleCrearProyecto = (e) => {
                e.preventDefault();
                if (!nombreProyectoInput.trim()) return;

                const nuevoProyecto = {
                    id: Date.now().toString(),
                    nombre: nombreProyectoInput,
                    circuito: circuitoInput || "N/A",
                    municipio: municipioInput || "Magangué",
                    items: {} // { itemId: cantidad }
                };

                setProyectos([...proyectos, nuevoProyecto]);
                setNombreProyectoInput("");
                setCircuitoInput("");
                setMunicipioInput("");
                setModalCrear(false);
            };

            const handleActualizarProyecto = (e) => {
                e.preventDefault();
                if (!nombreProyectoInput.trim() || !proyectoAEditar) return;

                setProyectos(proyectos.map(p => {
                    if (p.id === proyectoAEditar.id) {
                        return { ...p, nombre: nombreProyectoInput, circuito: circuitoInput, municipio: municipioInput };
                    }
                    return p;
                }));

                setModalEditar(false);
                setProyectoAEditar(null);
            };

            const abrirModalEdicion = (proj) => {
                setProyectoAEditar(proj);
                setNombreProyectoInput(proj.nombre);
                setCircuitoInput(proj.circuito);
                setMunicipioInput(proj.municipio);
                setModalEditar(true);
            };

            const eliminarProyecto = (id) => {
                if (confirm("¿Estás seguro de eliminar este proyecto y su planilla asociada?")) {
                    setProyectos(proyectos.filter(p => p.id !== id));
                    if (proyectoActivoId === id) setProyectoActivoId(null);
                }
            };

            // Modificar cantidades en la planilla del proyecto activo
            const cambiarCantidad = (itemId, cantidad) => {
                if (!proyectoActivo) return;
                const val = parseInt(cantidad) || 0;
                
                const nuevosItems = { ...proyectoActivo.items };
                if (val <= 0) {
                    delete nuevosItems[itemId];
                } else {
                    nuevosItems[itemId] = val;
                }

                setProyectos(proyectos.map(p => {
                    if (p.id === proyectoActivoId) {
                        return { ...p, items: nuevosItems };
                    }
                    return p;
                }));
            };

            // Exportar planilla activa a Excel
            const exportarExcel = () => {
                if (!proyectoActivo) return;

                const datosExportar = SEED_CATALOG.map(item => {
                    const cantidad = proyectoActivo.items[item.item] || 0;
                    return {
                        "Armado / Sistema": item.armado,
                        "Código Ítem": item.item,
                        "Descripción del Material": item.descripcion,
                        "Cantidad": cantidad
                    };
                }).filter(row => row.Cantidad > 0); // Opcional: solo exportar los que tengan cantidad > 0 (o quitar filtro si prefieres todos)

                if (datosExportar.length === 0) {
                    alert("No hay materiales con cantidades registradas para exportar.");
                    return;
                }

                const worksheet = XLSX.utils.json_to_sheet(datosExportar);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Planilla Materiales");
                
                // Descargar archivo
                XLSX.writeFile(workbook, `Planilla_${proyectoActivo.nombre.replace(/\s+/g, '_')}.xlsx`);
            };

            const itemsFiltrados = useMemo(() => {
                return SEED_CATALOG.filter(item => 
                    item.descripcion.toLowerCase().includes(busquedaMaterial.toLowerCase()) ||
                    item.item.includes(busquedaMaterial) ||
                    item.armado.toLowerCase().includes(busquedaMaterial.toLowerCase())
                );
            }, [busquedaMaterial]);

            // VISTA 1: Selector / Pantalla de Proyectos
            if (!proyectoActivoId) {
                return (
                    <div className="max-w-5xl mx-auto p-6">
                        <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 gap-4">
                            <div>
                                <h1 className="text-2xl font-bold text-slate-900">Gestión de Proyectos y Redes</h1>
                                <p className="text-sm text-slate-500">Selecciona un proyecto o crea uno nuevo para gestionar tu planilla de materiales.</p>
                            </div>
                            <button 
                                onClick={() => { setNombreProyectoInput(""); setCircuitoInput(""); setMunicipioInput(""); setModalCrear(true); }}
                                className="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-xl shadow transition flex items-center gap-2 cursor-pointer">
                                + Nuevo Proyecto
                            </button>
                        </header>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {proyectos.map(proj => (
                                <div key={proj.id} className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-col justify-between hover:shadow-md transition">
                                    <div>
                                        <div className="flex justify-between items-start mb-3">
                                            <span className="text-xs font-semibold px-2.5 py-1 bg-blue-50 text-blue-700 rounded-lg">
                                                {proj.circuito || "Sin Circuito"}
                                            </span>
                                            <span className="text-xs text-slate-400">{proj.municipio}</span>
                                        </div>
                                        <h3 className="font-bold text-slate-800 text-lg mb-2 line-clamp-2">{proj.nombre}</h3>
                                        <p className="text-xs text-slate-500 mb-4">
                                            Ítem(s) registrados: <span className="font-semibold text-slate-700">{Object.keys(proj.items || {}).length}</span>
                                        </p>
                                    </div>
                                    <div className="flex items-center gap-2 pt-4 border-t border-slate-100">
                                        <button 
                                            onClick={() => setProyectoActivoId(proj.id)}
                                            className="flex-1 bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium py-2 rounded-xl transition cursor-pointer text-center">
                                            Abrir Planilla
                                        </button>
                                        <button 
                                            onClick={() => abrirModalEdicion(proj)}
                                            className="p-2 border border-slate-200 hover:bg-slate-50 rounded-xl text-slate-600 transition cursor-pointer" title="Modificar">
                                            ✏️
                                        </button>
                                        <button 
                                            onClick={() => eliminarProyecto(proj.id)}
                                            className="p-2 border border-red-100 hover:bg-red-50 rounded-xl text-red-600 transition cursor-pointer" title="Eliminar">
                                            🗑️
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Modal Crear / Editar Proyecto */}
                        {(modalCrear || modalEditar) && (
                            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                                <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
                                    <h3 className="text-lg font-bold text-slate-900 mb-4">
                                        {modalCrear ? "Crear Nuevo Proyecto" : "Modificar Proyecto"}
                                    </h3>
                                    <form onSubmit={modalCrear ? handleCrearProyecto : handleActualizarProyecto} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">Nombre del Proyecto / Obra</label>
                                            <input 
                                                type="text" 
                                                required
                                                placeholder="Ej. Normalización de Redes MT/BT"
                                                className="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                value={nombreProyectoInput}
                                                onChange={(e) => setNombreProyectoInput(e.target.value)}
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">Circuito o Transformador</label>
                                            <input 
                                                type="text" 
                                                placeholder="Ej. MT-102"
                                                className="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                value={circuitoInput}
                                                onChange={(e) => setCircuitoInput(e.target.value)}
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">Municipio / Zona</label>
                                            <input 
                                                type="text" 
                                                placeholder="Ej. Magangué"
                                                className="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                value={municipioInput}
                                                onChange={(e) => setMunicipioInput(e.target.value)}
                                            />
                                        </div>
                                        <div className="flex justify-end gap-3 pt-4">
                                            <button 
                                                type="button" 
                                                onClick={() => { setModalCrear(false); setModalEditar(false); }}
                                                className="px-4 py-2 border border-slate-200 text-slate-600 text-sm font-medium rounded-xl hover:bg-slate-50 cursor-pointer">
                                                Cancelar
                                            </button>
                                            <button 
                                                type="submit" 
                                                className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-xl shadow cursor-pointer">
                                                {modalCrear ? "Guardar Proyecto" : "Actualizar"}
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // VISTA 2: Planilla de Materiales del Proyecto Activo
            return (
                <div className="max-w-6xl mx-auto p-4 md:p-6">
                    <header className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <button 
                                onClick={() => setProyectoActivoId(null)}
                                className="text-xs font-semibold text-blue-600 hover:underline mb-1 inline-block cursor-pointer">
                                ← Volver a Proyectos
                            </button>
                            <h1 className="text-xl md:text-2xl font-bold text-slate-900">{proyectoActivo.nombre}</h1>
                            <p className="text-xs text-slate-500 mt-0.5">Circuito: <span className="font-medium text-slate-700">{proyectoActivo.circuito}</span> | Zona: <span className="font-medium text-slate-700">{proyectoActivo.municipio}</span></p>
                        </div>
                        <div className="flex items-center gap-3 w-full md:w-auto">
                            <button 
                                onClick={exportarExcel}
                                className="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2.5 rounded-xl shadow transition text-sm flex items-center justify-center gap-2 cursor-pointer">
                                📊 Exportar a Excel
                            </button>
                        </div>
                    </header>

                    {/* Barra de Búsqueda */}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6">
                        <input 
                            type="text" 
                            placeholder="Buscar material por descripción, código de ítem o armado..." 
                            className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                            value={busquedaMaterial}
                            onChange={(e) => setBusquedaMaterial(e.target.value)}
                        />
                    </div>

                    {/* Tabla de Planilla */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-50 text-slate-600 text-xs uppercase tracking-wider border-b border-slate-200">
                                        <th className="p-4">Armado</th>
                                        <th className="p-4">Ítem</th>
                                        <th className="p-4">Descripción</th>
                                        <th className="p-4 text-center w-36">Cantidad</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 text-sm">
                                    {itemsFiltrados.map((row) => {
                                        const cantidadActual = proyectoActivo.items[row.item] || "";
                                        return (
                                            <tr key={row.item} className="hover:bg-slate-50/80">
                                                <td className="p-4 font-medium text-slate-600 text-xs">{row.armado}</td>
                                                <td className="p-4 text-blue-600 font-mono text-xs">{row.item}</td>
                                                <td className="p-4 text-slate-700">{row.descripcion}</td>
                                                <td className="p-4 text-center">
                                                    <input 
                                                        type="number" 
                                                        min="0"
                                                        placeholder="0"
                                                        className="w-24 p-2 text-center bg-slate-50 border border-slate-200 rounded-lg text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500"
                                                        value={cantidadActual}
                                                        onChange={(e) => cambiarCantidad(row.item, e.target.value)}
                                                    />
                                                </td>
                                            </tr>
                                        );
                                    })}
                                    {itemsFiltrados.length === 0 && (
                                        <tr>
                                            <td colSpan="4" className="p-8 text-center text-slate-400 text-sm">
                                                No se encontraron materiales con ese criterio de búsqueda.
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
