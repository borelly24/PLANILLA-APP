<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planilla App</title>
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para traducir JSX y ES6 -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS (opcional, para que luzca bien) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        // Extraemos los hooks de React de forma global
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // Catálogo semilla adaptado
        const SEED_CATALOG = [
            { "armado": "POSTE", "item": "80", "descripcion": "Colocación de poste de concreto de 12m o 14m – 2.500, 1.600, 1.324, 1.030, 735 o 500 daN" },
            { "armado": "POSTE", "item": "81", "descripcion": "Colocación de poste de concreto de 8, 9 o 10m – 1.324, 1.030, 735 o 500 daN" },
            { "armado": "POSTE", "item": "1459733", "descripcion": "POSTE HPC/HPV 9MX500 DAN(CR)" },
            { "armado": "POSTE", "item": "1807941", "descripcion": "POSTE HPC/HPV 9MX735 DAN(CR)" },
            { "armado": "POSTE", "item": "1807940", "descripcion": "POSTE HPC/HPV 9MX1030 DAN(CR)" },
            { "armado": "POSTE", "item": "1475174", "descripcion": "POSTE HPC/HPV 12MX735 DAN(CR)" },
            { "armado": "POSTE", "item": "1465239", "descripcion": "POSTE HPC/HPV 12MX1030 DAN(CR)" },
            { "armado": "POSTE", "item": "1807947", "descripcion": "POSTE HPC/HPV 12MX1324 DAN(CR)" },
            { "armado": "POSTE", "item": "2000070", "descripcion": "POSTE HPC/HPV 12MX1600 DAN(CR)" },
            { "armado": "POSTE", "item": "88", "descripcion": "Concreto Fc=210kgf/cm2 fundición para poste" },
            { "armado": "POSTE", "item": "1310002", "descripcion": "CEMENTO GRIS" },
            { "armado": "POSTE", "item": "89", "descripcion": "Colocación del sistema de puesta a tierra" },
            { "armado": "POSTE", "item": "1808482", "descripcion": "CABLE DESNUDO COPPER CLAD 7H#8AWG 3/8\"" },
            { "armado": "POSTE", "item": "1525655", "descripcion": "VARILLA DE PUESTA A TIERRA 5/8X8\"" },
            { "armado": "POSTE", "item": "1808483", "descripcion": "CONECTOR CUÑA PAT 5/8\" P/CABLE(CCS)" },
            { "armado": "POSTE", "item": "1531537", "descripcion": "CONECTOR COMPRESION PICA PT" }
        ];

        function App() {
            const [busqueda, setBusqueda] = useState("");

            const itemsFiltrados = useMemo(() => {
                return SEED_CATALOG.filter(item => 
                    item.descripcion.toLowerCase().includes(busqueda.toLowerCase()) ||
                    item.item.includes(busqueda)
                );
            }, [busqueda]);

            return (
                <div className="max-w-4xl mx-auto p-6">
                    <h1 className="text-2xl font-bold text-slate-800 mb-4">Planilla App - Materiales</h1>
                    <input 
                        type="text" 
                        placeholder="Buscar por código o descripción..." 
                        className="w-full p-3 mb-4 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                        value={busqueda}
                        onChange={(e) => setBusqueda(e.target.value)}
                    />
                    <div className="bg-white rounded-lg shadow overflow-hidden">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-slate-200 text-slate-700 text-sm">
                                    <th className="p-3">Armado</th>
                                    <th className="p-3">Ítem</th>
                                    <th className="p-3">Descripción</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-200 text-sm">
                                {itemsFiltrados.map((row, index) => (
                                    <tr key={index} className="hover:bg-slate-50">
                                        <td className="p-3 font-medium text-slate-600">{row.armado}</td>
                                        <td className="p-3 text-blue-600 font-mono">{row.item}</td>
                                        <td className="p-3 text-slate-700">{row.descripcion}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
