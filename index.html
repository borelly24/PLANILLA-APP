            <div class="p-4 bg-gray-50 border-b flex justify-between items-center">
                <h3 class="font-semibold text-gray-700"><i class="fas fa-list-alt text-indigo-500 mr-2"></i>Detalle de Registros</h3>
                <span id="contadorItems" class="text-xs bg-indigo-100 text-indigo-800 font-bold px-2.5 py-1 rounded-full">0 ítems</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-xs uppercase tracking-wider">
                            <th class="p-3 border-b">Fecha</th>
                            <th class="p-3 border-b">Código</th>
                            <th class="p-3 border-b">Descripción del Ítem</th>
                            <th class="p-3 border-b text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPlanillaBody" class="text-sm text-gray-700 divide-y divide-gray-200">
                        <!-- Los registros se cargan dinámicamente aquí -->
                    </tbody>
                </table>
            </div>
        </div>

    <!-- Script de control y lógica -->
    <script>
        let listaPlanilla = [];

        // Cargar datos almacenados al iniciar
        document.addEventListener('DOMContentLoaded', () => {
            const guardados = localStorage.getItem('planilla_items_redes');
            if (guardados) {
                listaPlanilla = JSON.parse(guardados);
            }
            document.getElementById('inputFecha').valueAsDate = new Date();
            renderizarTabla();
        });

        function guardarEnLocalStorage() {
            localStorage.setItem('planilla_items_redes', JSON.stringify(listaPlanilla));
        }

        function agregarItem() {
            const fecha = document.getElementById('inputFecha').value;
            const descargo = document.getElementById('inputDescargo').value.trim();
            const selectValue = document.getElementById('selectItem').value;

            if (!selectValue) {
                alert("Por favor seleccione un ítem de la lista.");
                return;
            }

            const separatorIndex = selectValue.indexOf('|');
            const codigo = selectValue.substring(0, separatorIndex);
            const descripcion = selectValue.substring(separatorIndex + 1);

            const nuevoRegistro = {
                id: Date.now(),
                fecha: fecha || 'N/A',
                descargo: descargo || 'S/N',
                codigo: codigo,
                descripcion: descripcion
            };

            listaPlanilla.push(nuevoRegistro);
            guardarEnLocalStorage();
            renderizarTabla();

            document.getElementById('inputDescargo').value = '';
        }

        function eliminarItem(id) {
            listaPlanilla = listaPlanilla.filter(item => item.id !== id);
            guardarEnLocalStorage();
            renderizarTabla();
        }

        // Función para eliminar todos los ítems con confirmación
        function confirmarEliminarTodo() {
            if (listaPlanilla.length === 0) {
                alert("La planilla ya se encuentra vacía.");
                return;
            }

            const seguro = confirm("¿Estás seguro de que deseas eliminar TODOS los ítems de la planilla? Esta acción no se puede deshacer.");
            if (seguro) {
                listaPlanilla = [];
                guardarEnLocalStorage();
                renderizarTabla();
            }
        }

        function renderizarTabla() {
            const tbody = document.getElementById('tablaPlanillaBody');
            const contador = document.getElementById('contadorItems');
            tbody.innerHTML = '';

            contador.textContent = `${listaPlanilla.length} ítem${listaPlanilla.length !== 1 ? 's' : ''}`;

            if (listaPlanilla.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-gray-400 italic">No hay registros agregados en la planilla.</td></tr>`;
                return;
            }

            listaPlanilla.forEach((item) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition";
                tr.innerHTML = `
                    <td class="p-3 border-b text-xs text-gray-500">${item.fecha}</td>
                    <td class="p-3 border-b font-mono font-semibold text-blue-600">${item.codigo}</td>
                    <td class="p-3 border-b">${item.descripcion}</td>
                    <td class="p-3 border-b text-center">
                        <button onclick="eliminarItem(${item.id})" class="text-red-500 hover:text-red-700 p-1 rounded transition" title="Eliminar ítem">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function exportarExcel() {
            if (listaPlanilla.length === 0) {
                alert("No hay datos para exportar.");
                return;
            }

            const datosExportar = listaPlanilla.map((item, index) => ({
                "N°": index + 1,
                "Fecha": item.fecha,
                "Descargo / Estación": item.descargo,
                "Código Ítem": item.codigo,
                "Descripción": item.descripcion
            }));

            const worksheet = XLSX.utils.json_to_sheet(datosExportar);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Planilla_Obras");
            XLSX.writeFile(workbook, "Planilla_Liquidacion_Redes.xlsx");
        }
    </script>
