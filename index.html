<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planilla de Liquidación y Redes</title>
    <!-- Tailwind CSS para un diseño moderno y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS para exportar a Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <div class="container mx-auto px-4 py-6 max-w-7xl">
        <!-- Encabezado -->
        <header class="bg-white shadow-md rounded-lg p-6 mb-6 flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-800"><i class="fas fa-bolt text-yellow-500 mr-2"></i>Control de Planilla de Redes</h1>
                <p class="text-sm text-gray-500">Supervisión y Liquidación de Obras Eléctricas</p>
            </div>
            <div class="mt-4 md:mt-0 flex flex-wrap gap-2">
                <button onclick="exportarExcel()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center shadow transition">
                    <i class="fas fa-file-excel mr-2"></i> Exportar Excel
                </button>
                <!-- NUEVO BOTÓN: Eliminar todos los ítems -->
                <button onclick="confirmarEliminarTodo()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center shadow transition">
                    <i class="fas fa-trash-alt mr-2"></i> Eliminar Todos
                </button>
            </div>
        </header>

        <!-- Formulario de adición de ítems -->
        <div class="bg-white shadow-md rounded-lg p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-4"><i class="fas fa-plus-circle text-blue-500 mr-2"></i>Agregar Nuevo Ítem</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Fecha</label>
                    <input type="date" id="inputFecha" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">N° Descargo / Estación</label>
                    <input type="text" id="inputDescargo" placeholder="Ej. 1810891 o Estación" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Seleccionar o Buscar Ítem / Descripción</label>
                    <select id="selectItem" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
                        <option value="">-- Seleccione un ítem del catálogo --</option>
                        <option value="1|Inspección Servicio Medida Directa">1 - Inspección Servicio Medida Directa</option>
                        <option value="2|Instalación completa del suministro (Medida directa)">2 - Instalación completa del suministro (Medida directa)</option>
                        <option value="80|Colocación de poste de concreto 12m-2500-1600-1324-1030-735-500 daN">80 - Colocación de poste de concreto 12m</option>
                        <option value="1810891|ABRAZADERA 200MM UNA SALIDA P/TRANSFORMA">1810891 - ABRAZADERA 200MM UNA SALIDA P/TRANSFORMA</option>
                        <option value="1441249|AISLADOR POLIMERICO SUSP 13.2KV">1441249 - AISLADOR POLIMERICO SUSP 13.2KV</option>
                    </select>
                </div>
            </div>
            <div class="mt-4 flex justify-end">
                <button onclick="agregarItem()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg text-sm font-semibold shadow transition">
                    <i class="fas fa-plus mr-1"></i> Añadir a la Planilla
                </button>
            </div>
        </div>

        <!-- Tabla de la Planilla -->
        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <div class="p-4 bg-gray-50 border-b flex justify-between items-center">
                <h3 class="font-semibold text-gray-700"><i class="fas fa-list-alt text-indigo-500 mr-2"></i>Detalle de Registros</h3>
                <span id="contadorItems" class="text-xs bg-indigo-100 text-indigo-800 font-bold px-2.5 py-1 rounded-full">0 ítems</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-xs uppercase tracking-wider">
                            <th class="p-3 border-b">Fecha</th>
                            <th class="p-3 border-b">Código</th>
                            <th class="p-3 border-b">Descripción del Ítem</th>
                            <th class="p-3 border-b text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPlanillaBody" class="text-sm text-gray-700 divide-y divide-gray-200">
                        <!-- Los registros se cargan dinámicamente aquí -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script de control y lógica -->
    <script>
        let listaPlanilla = [];

        // Cargar datos almacenados al iniciar
        document.addEventListener('DOMContentLoaded', () => {
            const guardados = localStorage.getItem('planilla_items_redes');
            if (guardados) {
                listaPlanilla = JSON.parse(guardados);
            }
            document.getElementById('inputFecha').valueAsDate = new Date();
            renderizarTabla();
        });

        function guardarEnLocalStorage() {
            localStorage.setItem('planilla_items_redes', JSON.stringify(listaPlanilla));
        }

        function agregarItem() {
            const fecha = document.getElementById('inputFecha').value;
            const descargo = document.getElementById('inputDescargo').value.trim();
            const selectValue = document.getElementById('selectItem').value;

            if (!selectValue) {
                alert("Por favor seleccione un ítem de la lista.");
                return;
            }

            const [codigo, descripcion] = selectValue.split('|');

            const nuevoRegistro = {
                id: Date.now(),
                fecha: fecha || 'N/A',
                descargo: descargo || 'S/N',
                codigo: codigo,
                descripcion: descripcion
            };

            listaPlanilla.push(nuevoRegistro);
            guardarEnLocalStorage();
            renderizarTabla();

            // Limpiar campo secundario opcional
            document.getElementById('inputDescargo').value = '';
        }

        function eliminarItem(id) {
            listaPlanilla = listaPlanilla.filter(item => item.id !== id);
            guardarEnLocalStorage();
            renderizarTabla();
        }

        // NUEVA FUNCIÓN: Eliminar todos los ítems con confirmación
        function confirmarEliminarTodo() {
            if (listaPlanilla.length === 0) {
                alert("La planilla ya se encuentra vacía.");
                return;
            }

            const seguro = confirm("¿Estás seguro de que deseas eliminar TODOS los ítems de la planilla? Esta acción no se puede deshacer.");
            if (seguro) {
                listaPlanilla = [];
                guardarEnLocalStorage();
                renderizarTabla();
            }
        }

        function renderizarTabla() {
            const tbody = document.getElementById('tablaPlanillaBody');
            const contador = document.getElementById('contadorItems');
            tbody.innerHTML = '';

            contador.textContent = `${listaPlanilla.length} ítem${listaPlanilla.length !== 1 ? 's' : ''}`;

            if (listaPlanilla.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-gray-400 italic">No hay registros agregados en la planilla.</td></tr>`;
                return;
            }

            listaPlanilla.forEach((item) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition";
                tr.innerHTML = `
                    <td class="p-3 border-b text-xs text-gray-500">${item.fecha}</td>
                    <td class="p-3 border-b font-mono font-semibold text-blue-600">${item.codigo}</td>
                    <td class="p-3 border-b">${item.descripcion}</td>
                    <td class="p-3 border-b text-center">
                        <button onclick="eliminarItem(${item.id})" class="text-red-500 hover:text-red-700 p-1 rounded transition" title="Eliminar ítem">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function exportarExcel() {
            if (listaPlanilla.length === 0) {
                alert("No hay datos para exportar.");
                return;
            }

            const datosExportar = listaPlanilla.map((item, index) => ({
                "N°": index + 1,
                "Fecha": item.fecha,
                "Descargo / Estación": item.descargo,
                "Código Ítem": item.codigo,
                "Descripción": item.descripcion
            }));

            const worksheet = XLSX.utils.json_to_sheet(datosExportar);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Planilla_Obras");
            XLSX.writeFile(workbook, "Planilla_Liquidacion_Redes.xlsx");
        }
    </script>
</body>
</html>
